openapi: 3.2.0
info:
  title: Campfire Developer Cash Management API
  version: 1.0.0
  description: '## Introduction

    Campfire''s developer APIs offer granular access to Campfire''s core accounting,

    revenue recognition, and financial data features.


    These APIs are designed to be used by developers to build custom integrations,

    automate workflows, and perform any other programmatic operations.'
servers:
- url: https://api.meetcampfire.com
  description: Production server
tags:
- name: Cash Management
  description: Operations related to accounts, transactions, and other bank-related data.
paths:
  /ca/api/account:
    get:
      operationId: list_accounts
      description: 'Retrieve a paginated list of bank accounts.


        Supports including soft-deleted records for audit and recovery purposes.

        When include_deleted=true, deleted records will have is_deleted=true

        and include deletion metadata (deleted_at timestamp).


        Supports sorting by all returned fields:

        - name, -name (account name)

        - nickname, -nickname (account nickname)

        - type, -type (account type)

        - status, -status (account status)

        - currency, -currency (account currency)

        - external_account_id, -external_account_id (external account ID)

        - institution_id, -institution_id (institution ID)

        - source, -source (account source)

        - current_balance, -current_balance (current balance)

        - available_balance, -available_balance (available balance)

        - created_at, -created_at (creation date)

        - last_modified_at, -last_modified_at (last modified date)

        - account_type, -account_type (chart account type)

        - account_subtype, -account_subtype (chart account subtype)

        - account_cashflow_classification, -account_cashflow_classification (cashflow classification)

        - type_name, -type_name (human-readable account type)

        - subtype_name, -subtype_name (human-readable account subtype)

        - cashflow_classification_name, -cashflow_classification_name (human-readable cashflow classification)

        - entity_name, -entity_name (entity name)

        - department, -department (department name)

        - id, -id (account ID)

        - account_id, -account_id (UUID account ID)'
      summary: List Bank Accounts
      parameters:
      - in: query
        name: chart_of_accounts_account
        schema:
          type: integer
        description: Filter bank accounts by their linked chart of accounts account ID
      - in: query
        name: include_deleted
        schema:
          type: boolean
          default: false
        description: 'When set to ''true'', returns ONLY deleted records instead of active records. Deleted records contain minimal data: ''id'', ''is_deleted=true'', ''deleted_at'' timestamp, and ''last_modified_at''. When ''false'' or omitted, returns ONLY active records. This provides clean separation between active and deleted data.'
      - in: query
        name: last_modified_at__gte
        schema:
          type: string
        description: 'Filter for records modified on or after this timestamp. Format: ISO 8601 (e.g., ''2024-01-01T00:00:00Z'' or ''2024-01-01''). Works with both active records and deleted records (filters by deletion time for deleted records).'
      - in: query
        name: last_modified_at__lte
        schema:
          type: string
        description: 'Filter for records modified on or before this timestamp. Format: ISO 8601 (e.g., ''2024-12-31T23:59:59Z'' or ''2024-12-31''). Works with both active records and deleted records (filters by deletion time for deleted records).'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - Cash Management
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBankAccountList'
          description: ''
    post:
      operationId: create_account
      description: Create a new bank account
      summary: Create Bank Account
      tags:
      - Cash Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccount'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BankAccount'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BankAccount'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
          description: ''
  /ca/api/account/{id}:
    get:
      operationId: ca_api_account_retrieve
      summary: Retrieve Bank Account
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Cash Management
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
          description: ''
    put:
      operationId: ca_api_account_update
      summary: Update Bank Account
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Cash Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccount'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BankAccount'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BankAccount'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
          description: ''
    patch:
      operationId: ca_api_account_partial_update
      summary: Partial Update Bank Account
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Cash Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBankAccount'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBankAccount'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBankAccount'
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccount'
          description: ''
    delete:
      operationId: ca_api_account_destroy
      summary: Delete Bank Account
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: new_account
        schema:
          type: integer
        description: ID of the bank account to reassign transactions to before deletion
      tags:
      - Cash Management
      security:
      - knoxApiToken: []
      responses:
        '204':
          description: No response body
  /ca/api/bank-feed/{account_id}:
    post:
      operationId: ca_api_bank_feed_create
      description: Ingest bank feed data for a specific bank account. Creates bank transactions with corresponding journal entries, updates account balances, and triggers auto-categorization.
      summary: Post Bank Feed
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - Cash Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankFeed'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BankFeed'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BankFeed'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bank feed processed successfully
                  account_id:
                    type: integer
                  submitted_count:
                    type: integer
                  created_count:
                    type: integer
                  skipped_count:
                    type: integer
                  skipped_transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        external_transaction_id:
                          type: string
                        reason:
                          type: string
                  failed_count:
                    type: integer
                  failed_transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        external_transaction_id:
                          type: string
                        reason:
                          type: string
          description: ''
  /ca/api/transaction:
    get:
      operationId: list_bank_transactions
      description: 'Retrieve a paginated list of bank transactions with optional filtering.


        Supports including soft-deleted records for audit and recovery purposes.

        When include_deleted=true, deleted records will have is_deleted=true

        and include deletion metadata (deleted_at timestamp).'
      summary: List Bank Transactions
      parameters:
      - in: query
        name: exclude_drafts
        schema:
          type: boolean
        description: If true, hide bank transactions that have a pending cash-application DraftQueue attached (match drafts or categorize drafts). Default false.
      - in: query
        name: include_deleted
        schema:
          type: boolean
          default: false
        description: 'When set to ''true'', returns ONLY deleted records instead of active records. Deleted records contain minimal data: ''id'', ''is_deleted=true'', ''deleted_at'' timestamp, and ''last_modified_at''. When ''false'' or omitted, returns ONLY active records. This provides clean separation between active and deleted data.'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - Cash Management
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBankTransactionList'
          description: ''
    post:
      operationId: create_bank_transaction
      description: Create a new bank transaction
      summary: Create Bank Transaction
      tags:
      - Cash Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankTransaction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BankTransaction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BankTransaction'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransaction'
          description: ''
  /ca/api/transaction/{id}:
    get:
      operationId: ca_api_transaction_retrieve
      summary: Retrieve Bank Transaction
      parameters:
      - in: path
        name: id
        schema:
          type: integer
