          description: No response body
components:
  schemas:
    NullEnum:
      enum:
      - null
    BankAccountTypeEnum:
      enum:
      - CHECKING
      - SAVING
      - CREDIT_CARD
      - DEBIT_CARD
      - INVESTMENT
      - LOAN
      type: string
      description: '* `CHECKING` - Checking

        * `SAVING` - Savings

        * `CREDIT_CARD` - Credit Card

        * `DEBIT_CARD` - Debit Card

        * `INVESTMENT` - Investment

        * `LOAN` - Loan'
    BlankEnum:
      enum:
      - ''
    BankTransaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_deleted:
          type: boolean
          readOnly: true
          default: false
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        account_name:
          type: string
          readOnly: true
        entity_name:
          type:
          - string
          - 'null'
          readOnly: true
        date_month:
          type:
          - string
          - 'null'
          readOnly: true
        date_year:
          type:
          - string
          - 'null'
          readOnly: true
        journal:
          type:
          - integer
          - 'null'
          readOnly: true
        journal_order:
          type:
          - string
          - 'null'
          readOnly: true
        intercompany_journal:
          type:
          - integer
          - 'null'
          readOnly: true
        reconciliation_report:
          type: integer
          readOnly: true
        reconciliation_report_ending_date:
          type: string
          format: date
          readOnly: true
        last_modified_at:
          type: string
          format: date-time
          readOnly: true
        transaction_id:
          type: string
          format: uuid
        external_transaction_id:
          type:
          - string
          - 'null'
          maxLength: 200
        currency:
          type: string
          maxLength: 3
        amount:
          type:
          - number
          - 'null'
          format: double
          exclusiveMinimum: -1000000000000000000
          exclusiveMaximum: 1000000000000000000
        amount_native:
          type:
          - number
          - 'null'
          format: double
          exclusiveMinimum: -1000000000000000000
          exclusiveMaximum: 1000000000000000000
        posted_at:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type:
          - string
          - 'null'
          maxLength: 250
        note:
          type:
          - string
          - 'null'
          maxLength: 1024
        bank_description:
          type:
          - string
          - 'null'
        external_memo:
          type:
          - string
          - 'null'
        merchant_id:
          type:
          - string
          - 'null'
        merchant_name:
          type:
          - string
          - 'null'
        merchant_nickname:
          type:
          - string
          - 'null'
        kind:
          type:
          - string
          - 'null'
        excluded:
          type: boolean
        assigned:
          type: boolean
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        customer:
          type: integer
          readOnly: true
        account:
          type: integer
      required:
      - account
      - account_name
      - created_at
      - customer
      - date_month
      - date_year
      - deleted_at
      - entity_name
      - id
      - intercompany_journal
      - is_deleted
      - journal
      - journal_order
      - last_modified_at
      - reconciliation_report
      - reconciliation_report_ending_date
    PaginatedBankAccountList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/BankAccount'
    BankAccount:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_deleted:
          type: boolean
          readOnly: true
          default: false
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        entity_name:
          type: string
          readOnly: true
        department_name:
          type: string
          readOnly: true
        chart_of_accounts_account_name:
          type: string
          readOnly: true
        account_type:
          type: string
          readOnly: true
        account_subtype:
          type: string
          readOnly: true
        account_cashflow_classification:
          type: string
          readOnly: true
        type_name:
          type: string
          readOnly: true
        subtype_name:
