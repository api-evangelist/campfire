          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillDraftWrite'
          description: ''
    patch:
      operationId: partial_update_bill_draft
      description: GET detail + PATCH update on a single BillDraft.
      summary: Partial Update Bill Draft
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Accounts Payable
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBillDraftWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBillDraftWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBillDraftWrite'
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillDraftWrite'
          description: ''
  /coa/api/v1/bill-draft/{id}/abandon:
