    post:
      operationId: coa_api_v1_debit_memo_payment_void_create
      description: "Void a debit memo 'mark used' payment by creating a reversing journal entry.\n\n        This creates a reversing JE that credits the A/P account and debits Uncategorized,\n        then marks the payment as voided."
