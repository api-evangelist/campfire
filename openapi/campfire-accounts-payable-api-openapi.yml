      description: GET detail + PATCH update on a single BillDraft.
      summary: Update Bill Draft
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Accounts Payable
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillDraftWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BillDraftWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BillDraftWrite'
      security:
      - knoxApiToken: []
