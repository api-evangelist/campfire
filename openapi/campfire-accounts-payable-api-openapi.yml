    patch:
      operationId: coa_api_v1_bill_partial_update
      description: "\n        Performs a partial update of an existing accounting bill using PATCH semantics.\n\n        This endpoint allows selective modification of bill fields without requiring\n        a complete bill replacement. You can update specific aspects of the bill while\n        leaving other fields unchanged.\n\n        **Updatable Fields:**\n        - Bill metadata (number, dates, descriptions, vendor, entity)\n        - Line items (amounts, accounts, descriptions, departments)\n        - Payment terms and due dates\n        - Tax calculations and allocations\n        - Custom fields and tags\n        - Currency and exchange rates\n        "
      summary: Partial Update Accounting Bill
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Accounts Payable
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountingBill'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountingBill'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountingBill'
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingBill'
          description: ''
    delete:
      operationId: coa_api_v1_bill_destroy
      description: "\n        Permanently deletes an accounting bill and its associated journal entry.\n\n        This endpoint performs a complete deletion of the bill including:\n        - Removal of all bill line items and associated data\n        - Deletion of the corresponding accounts payable journal entry\n        - Cleanup of any tax calculations and allocations\n        - Removal of vendor payment allocations if applicable\n\n        **Important Notes:**\n        - This operation is irreversible and permanently removes the bill from the system\n        - The associated journal entry will be automatically deleted to maintain accounting integrity\n        - All double-entry bookkeeping records related to this bill will be removed\n        - Any payments allocated to this bill should be handled separately before deletion\n        - Deletion may affect financial reports and account balances\n\n        **Restrictions:**\n        - Bills with allocated payments may require payment reallocation first\n        - Consider the impact on historical financial reporting\n        - Bills cannot be deleted in a closed period\n        "
      summary: Delete Accounting Bill
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Accounts Payable
      security:
      - knoxApiToken: []
      responses:
        '204':
          description: No response body
