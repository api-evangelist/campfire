  /coa/api/v1/bill-draft:
    get:
      operationId: list_bill_drafts
      description: GET list (customer-scoped, ``status`` / ``source`` filterable) + POST UI upload.
      summary: List Bill Drafts
      tags:
      - Accounts Payable
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BillDraftRead'
          description: ''
    post:
      operationId: create_bill_draft
      description: GET list (customer-scoped, ``status`` / ``source`` filterable) + POST UI upload.
      summary: Create Bill Draft
      tags:
      - Accounts Payable
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillDraftCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BillDraftCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BillDraftCreate'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillDraftCreate'
          description: ''
