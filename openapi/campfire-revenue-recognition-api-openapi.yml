  /rr/api/v1/contracts/{contract_id}/subscriptions:
    get:
      operationId: list_contract_subscriptions
      description: "\n        Retrieve a list of contract subscriptions with optional filtering and sorting.\n\n        Supports including soft-deleted records for audit and recovery purposes.\n        When include_deleted=true, returns ONLY deleted records instead of active records.\n        Deleted records contain minimal data: 'id', 'is_deleted=true', 'deleted_at' timestamp,\n        and 'last_modified_at'. When 'false' or omitted, returns ONLY active records.\n        This provides clean separation between active and deleted data.\n        "
      summary: List Contract Subscriptions
      parameters:
      - in: path
        name: contract_id
        schema:
          type: integer
        required: true
      - in: query
        name: include_deleted
        schema:
          type: boolean
          default: false
        description: 'When set to ''true'', returns ONLY deleted records instead of active records. Deleted records contain minimal data: ''id'', ''is_deleted=true'', ''deleted_at'' timestamp, and ''last_modified_at''. When ''false'' or omitted, returns ONLY active records. This provides clean separation between active and deleted data.'
      - in: query
        name: last_modified_at__gte
        schema:
          type: string
        description: 'Filter for records modified on or after this timestamp. Format: ISO 8601 (e.g., ''2024-01-01T00:00:00Z'' or ''2024-01-01''). Works with both active records and deleted records (filters by deletion time for deleted records).'
      - in: query
        name: last_modified_at__lte
        schema:
          type: string
        description: 'Filter for records modified on or before this timestamp. Format: ISO 8601 (e.g., ''2024-12-31T23:59:59Z'' or ''2024-12-31''). Works with both active records and deleted records (filters by deletion time for deleted records).'
      tags:
      - Revenue Recognition
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContractSubscription'
          description: ''
    post:
      operationId: create_contract_subscription
      description: "\n    Create a new contract subscription.\n\n    Evergreen vs standard:\n    - Standard contract subscriptions generally provide explicit lines and fixed start/end dates.\n    - Evergreen contract subscriptions can provide period_amount to auto-generate lines. Their dates must align\n      to billing period boundaries and must not exceed the contract's current working_end_date.\n\n    Notes:\n    - Usage and milestone subscription flows are not supported for evergreen contracts.\n    - For evergreen contracts, period_amount is the source-of-truth amount per billing period.\n    - renewal_behavior:\n      - FOLLOW_CONTRACT: subscription follows evergreen contract extension windows.\n      - FIXED_END: subscription keeps its own fixed end_date and does not extend automatically.\n    "
      summary: Create Contract Subscription
      parameters:
      - in: path
        name: contract_id
        schema:
          type: integer
        required: true
      tags:
      - Revenue Recognition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractSubscription'
            examples:
              CreateStandardSubscription:
                value:
                  contract: 9001
                  product: 300
                  start_date: '2026-01-01'
                  end_date: '2026-12-31'
                  mrr: '2500.00'
                  lines:
                  - start_date: '2026-01-01'
                    end_date: '2026-12-31'
                    total_value: '30000.00'
                    mrr: '2500.00'
                summary: Create Standard Subscription
              CreateEvergreenSubscriptionWithPeriodAmount:
                value:
                  contract: 9002
                  product: 300
                  start_date: '2026-04-01'
                  renewal_behavior: FOLLOW_CONTRACT
                  period_amount: '10000.00'
                  lines: []
                summary: Create Evergreen Subscription with period_amount
              CreateEvergreenSubscriptionWithFixedEndDate:
                value:
                  contract: 9002
                  product: 300
                  start_date: '2026-04-01'
                  end_date: '2026-06-30'
                  renewal_behavior: FIXED_END
                  period_amount: '10000.00'
                  lines: []
                summary: Create Evergreen Subscription with fixed end date
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContractSubscription'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContractSubscription'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractSubscription'
          description: ''
