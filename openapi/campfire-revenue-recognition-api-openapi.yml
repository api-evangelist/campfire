      type: object
      properties:
        start_date:
          type: string
          format: date
          description: Start date of the subscription period.
        end_date:
          type: string
          format: date
          nullable: true
          description: End date of the subscription period. Defaults to 1 year from start date if not provided.
        total_value:
          type: number
          format: double
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          description: Total contract value for the subscription period.
        mrr:
          type: number
          format: double
          maximum: 1000000000000000000
          minimum: -1000000000000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          description: Monthly recurring revenue. If not provided, it is calculated from total_value and the subscription period.
        use_daily_accounting:
          type: boolean
          default: false
          description: Whether to use daily (vs monthly) revenue recognition.
        proration_method:
          nullable: true
          description: 'Proration method. When provided, takes precedence over use_daily_accounting (DAILY↔True, STANDARD/THIRTY_DAY↔False).


            * `standard` - Standard (actual month length)

            * `thirty_day` - Fixed 30-day month

            * `daily` - Daily'
