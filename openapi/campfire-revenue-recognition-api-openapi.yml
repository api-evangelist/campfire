          type: string
          format: date
          nullable: true
          description: Fixed end date for standard contracts. Leave null for evergreen contracts (is_evergreen=true).
        is_evergreen:
          type: boolean
          default: false
          description: Set true for evergreen contracts (no fixed end date). Evergreen contracts cannot also be auto-renew. Auto-renew is a legacy method to extend contracts.
