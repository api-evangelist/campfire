          type: boolean
          default: false
          description: When true, generated invoices are automatically sent on their invoice date.
        skip_evergreen_invoice_generation:
          type: boolean
          default: false
          description: For Evergreen contracts only. Set at contract creation; existing contracts cannot change this setting. False means current behavior. True skips only Campfire's auto-generated evergreen invoices; revenue transactions still generate; existing invoices are not cleaned up.
        auto_apply_customer_stripe_config_to_invoices:
          type: boolean
          default: false
          description: Evergreen contracts only. When true, evergreen-generated invoices inherit stripe_connection and use_stripe_auto_bill from the contract customer.
