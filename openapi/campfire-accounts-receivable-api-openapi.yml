          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountingInvoice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountingInvoice'
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingInvoice'
          description: ''
    delete:
      operationId: coa_api_v1_invoice_destroy
      description: "\n        Permanently deletes an accounting invoice and its associated journal entry and related data.\n\n        This endpoint performs a complete deletion of the invoice including:\n        - Removal of all invoice line items and associated product data\n        - Deletion of the corresponding accounts receivable journal entry\n        - Removal of payment records and journal entries\n\n        **Important Notes:**\n        - This operation is irreversible and permanently removes the invoice from the system\n        - The associated journal entry will be automatically deleted to maintain accounting integrity\n\n        **Restrictions:**\n        - Invoices in closed accounting periods cannot be deleted\n        - Consider the impact on historical financial reporting\n        "
      summary: Delete Invoice
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Accounts Receivable
      security:
      - knoxApiToken: []
      responses:
        '204':
          description: No response body
