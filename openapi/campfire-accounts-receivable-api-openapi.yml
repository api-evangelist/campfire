    put:
      operationId: coa_api_v1_invoice_update
      description: "\n        Performs a complete update of an existing accounting invoice using PUT semantics.\n\n        This endpoint allows full replacement of invoice data including:\n        - Complete invoice metadata update (dates, amounts, terms, client, entity)\n        - Full line item replacement with new products, quantities, rates, and tax calculations\n        - Journal entry recalculation and update with new accounting transactions\n        - Exchange rate updates for multi-currency invoices\n\n        **Important Notes:**\n        - This is a full replacement operation - all invoice data will be updated\n        - Missing fields in the request will be set to null or default values\n        - Existing line items will be completely replaced with the new line items\n        - Journal entries will be updated to reflect all changes\n        "
      summary: Update Invoice
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Accounts Receivable
      requestBody:
        content:
          application/json:
            schema:
