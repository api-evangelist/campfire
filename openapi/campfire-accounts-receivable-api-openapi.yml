      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingInvoice'
          description: ''
    patch:
      operationId: coa_api_v1_invoice_partial_update
      description: "\n        Performs a partial update of an existing accounting invoice using PATCH semantics.\n\n        This endpoint allows selective modification of invoice fields without requiring\n        a complete invoice replacement. You can update specific aspects of the invoice while\n        leaving other fields unchanged.\n\n        **Updatable Fields:**\n        - Invoice metadata (dates, terms, descriptions, client, entity, currency)\n        - Line items (amounts, accounts, descriptions, departments, products)\n        - Payment terms and due dates\n        - Tax calculations and allocations\n        - Custom fields and tags\n        - Contract and purchase order associations\n        - Exchange rates and currency information\n        "
      summary: Partial Update Invoice
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Accounts Receivable
      requestBody:
