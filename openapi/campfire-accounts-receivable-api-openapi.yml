  /coa/api/v1/invoice-payments:
    get:
      operationId: coa_api_v1_invoice_payments_list
      description: "\n        Retrieve a paginated list of invoice payments (payments applied against accounts\n        receivable invoices), designed for syncing payment data into external systems.\n\n        Results are ordered by (last_modified_at, id) ascending, so pages are stable and\n        a sync can resume from where it left off.\n\n        **Full sync (cursor pagination):**\n        - Pass an empty cursor parameter (cursor=) on the first request\n        - Follow the 'next' URL from each response until it is null\n\n        **Incremental sync (time-based):**\n        - Store the highest last_modified_at value you have processed\n        - On the next run, pass it as last_modified_at__gte to fetch only new and updated payments\n\n        **Voids:**\n        - Voided payments are included by default with voided_date set, so integrators can\n          detect payments that were reversed after a previous sync\n        - Filter with voided=true or voided=false to fetch only one kind\n        "
      summary: List Invoice Payments
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opts into cursor pagination. Pass an empty value (cursor=) on the first request, then follow the 'next' URL from each response until it is null. The cursor value is opaque - do not parse or construct it. Cursor pagination is recommended for full syncs as it avoids the performance penalty of deep offsets on large result sets.
      - in: query
        name: external_id
        schema:
          type: string
        description: Filter for the payment carrying this upstream external_id. Use it to reconcile a payment you created via the invoice pay endpoint back to your source-system record. An empty value is ignored and returns all payments.
      - in: query
        name: invoice_id
        schema:
          type: integer
        description: Filter for payments applied to this invoice id.
      - in: query
        name: last_modified_at__gte
        schema:
          type: string
        description: 'Filter for payments modified on or after this timestamp. Format: ISO 8601 (e.g., ''2024-01-01T00:00:00Z'' or ''2024-01-01''). Use this for incremental syncs: store the highest last_modified_at you have processed and pass it on the next sync run.'
      - in: query
        name: last_modified_at__lte
        schema:
          type: string
        description: 'Filter for payments modified on or before this timestamp. Format: ISO 8601 (e.g., ''2024-12-31T23:59:59Z'' or ''2024-12-31''). Date-only values are inclusive of the entire day.'
      - in: query
        name: limit
        schema:
          type: integer
          default: 100
        description: Maximum number of records to return per page. Default 100, maximum 10000. Use with offset to paginate
      - in: query
        name: offset
        schema:
          type: integer
          default: 0
        description: Number of records to skip before collecting the result page. Use with limit to paginate
      - in: query
        name: skip_count
        schema:
          type: boolean
          default: false
        description: When 'true', skips the total COUNT query and returns a lower-bound 'count' instead. Recommended for large syncs where the exact total is not needed.
      - in: query
        name: voided
        schema:
          type: boolean
        description: Filter by void status. When 'true', returns only voided payments (voided_date is set). When 'false', returns only active payments. When omitted, returns both so integrators can detect and propagate voids.
      tags:
      - Accounts Receivable
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvoicePaymentSyncList'
          description: ''
