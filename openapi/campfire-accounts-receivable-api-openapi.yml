  /coa/api/v1/invoice/:
    get:
      operationId: coa_api_v1_invoice_list
      description: "\n        Retrieve a paginated list of invoices with comprehensive filtering, sorting, and download capabilities.\n\n        This endpoint provides powerful invoice listing with:\n        - Advanced filtering by date ranges, status, clients, and entities\n        - Full-text search across multiple fields\n        - Flexible sorting options including custom calculated fields\n        - Async CSV export functionality via email\n        - Optimized queries with prefetched relationships\n\n        **Filtering Options:**\n        - Date-based filtering (invoice_date, due_date ranges)\n        - Status-based filtering (payment status, sent status, aging buckets)\n        - Entity and client-based filtering (supports multiple selections)\n        - Contract and currency filtering\n        - Full-text search across invoice numbers, addresses, messages, and client names\n\n        **Sorting Capabilities:**\n        - Standard field sorting (invoice_date, total_amount, due_date, etc.)\n        - Custom calculated field sorting (amount_due, client_name, contract_name)\n        - Ascending/descending order with null handling\n\n        **Performance Features:**\n        - Efficient database queries with proper indexing\n        - Prefetched related objects (lines, payments, clients, entities)\n        - Pagination support for large datasets\n        - Optimized for high-volume invoice management\n\n        **Export Functionality:**\n        - Async CSV generation and email delivery\n        - Filtered export based on current query parameters\n        - Background processing to handle large datasets\n        "
      summary: List Invoices
      parameters:
      - in: query
        name: client
        schema:
          type: integer
        description: Filter by client ID. Can be specified multiple times
        explode: true
        style: form
      - in: query
        name: contract
        schema:
          type: integer
        description: Filter by contract ID
      - in: query
        name: currency
        schema:
          type: string
        description: Filter by currency code (e.g., USD, EUR)
      - in: query
        name: download
        schema:
          type: boolean
          default: false
        description: If true, triggers async CSV download workflow and sends result via email
      - in: query
        name: end_date
        schema:
          type: string
        description: Filter invoices with invoice_date on or before this date (YYYY-MM-DD)
      - in: query
        name: entity
        schema:
          type: integer
        description: Filter by entity ID. Can be specified multiple times
        explode: true
        style: form
      - in: query
        name: invoice_number
        schema:
          type: string
        description: Filter by exact invoice number
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: line_tag_group_id
        schema:
          type: integer
        description: Filter invoices with at least one line item assigned a tag from this tag group ID
      - in: query
        name: line_tag_id
        schema:
          type: integer
        description: Filter invoices with at least one line item assigned this tag ID
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: paid_date_from
        schema:
          type: string
        description: Filter invoices with paid_date on or after this date (YYYY-MM-DD)
      - in: query
        name: paid_date_to
        schema:
          type: string
        description: Filter invoices with paid_date on or before this date (YYYY-MM-DD)
      - in: query
        name: parent_client
        schema:
          type: integer
        description: Filter by parent client (Vendor) ID. Returns invoices for the specified client and all of its descendants via vendor lineage.
      - in: query
        name: q
        schema:
          type: string
        description: Search query - searches shipping address, invoice number, message, or client name
      - in: query
        name: ref_number
        schema:
          type: string
        description: Filter by exact ref number
      - in: query
        name: sentStatus
        schema:
          type: string
          enum:
          - not_sent
          - sent
        description: Filter by sent status
      - in: query
        name: sort
        schema:
          type: string
          default: -invoice_date
        description: 'Sort order. Use field name for ascending, -field for descending. Special fields: client_name, amount_due. Default: -invoice_date'
      - in: query
        name: start_date
        schema:
          type: string
        description: Filter invoices with invoice_date on or after this date (YYYY-MM-DD)
      - in: query
        name: status
        schema:
          type: string
          enum:
          - '1_30'
          - '31_60'
          - '61_90'
          - '91_120'
          - current
          - over_120
          - paid
          - partially_paid
          - past_due
          - sent
          - uncollectible
          - unpaid
          - voided
        description: Filter by payment status
      tags:
      - Accounts Receivable
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountingInvoiceListList'
          description: ''
    post:
