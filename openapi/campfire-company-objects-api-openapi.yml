          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomField'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomField'
        required: true
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomField'
          description: ''
    patch:
      operationId: ca_api_v1_custom_fields_partial_update
      summary: Partial Update Custom Field
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Company Objects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomField'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomField'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomField'
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomField'
          description: ''
    delete:
      operationId: ca_api_v1_custom_fields_destroy
      summary: Delete Custom Field
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Company Objects
      security:
      - knoxApiToken: []
      responses:
        '204':
          description: No response body
  /coa/api/account:
    get:
