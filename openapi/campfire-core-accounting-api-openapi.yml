  /coa/api/transaction/merge:
    get:
      operationId: preview_chart_transaction_merge
      description: "\n        Preview the result of merging two chart transactions.\n\n        This endpoint shows what the merged journal entry will look like, allowing you to verify\n        the merge before committing. The preview includes the journal that will be retained and\n        the transactions that will remain after the merge.\n\n        **Parameters:**\n        - `transaction_ids` (query, required): Comma-separated list of exactly two transaction IDs\n\n        **Returns:**\n        A journal entry object containing the merged result with all remaining transactions.\n\n        **Requirements:**\n        - Must provide exactly two transaction IDs\n        - Transactions must be from different journals\n        - Transactions must have matching amounts\n        - Transactions must belong to the same entity\n        "
      summary: Preview Chart Transaction Merge
      tags:
      - Core Accounting
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Validation error - invalid transaction count, same journal, mismatched amounts, or mismatched entities
          description: ''
    post:
      operationId: merge_chart_transactions
      description: "\n        Merge two offsetting chart transactions from different journals.\n\n        This endpoint consolidates journals containing offsetting transactions by removing\n        the specified transactions and combining the remaining transactions into a single journal entry.\n\n        **Request Body:**\n        - `transaction_ids` (array, required): Array of exactly two transaction IDs to merge\n        - `transaction_match_id` (integer, optional): The AutoMergeSuggestion TransactionMatch\n          the user explicitly accepted; when it names a suggestion over exactly this pair, the\n          merge is recorded as a suggestion accept rather than a manual merge\n\n        **Returns:**\n        The merged journal entry with all remaining transactions.\n\n        **Requirements:**\n        - Must provide exactly two transaction IDs\n        - Transactions must be from different journals\n        - Transactions must have matching amounts\n        - Transactions must belong to the same entity\n\n        **Result:**\n        - The two specified transactions are deleted\n        - Other transactions from both journals are consolidated into a single journal\n        - A draft queue record is created for audit purposes and auto-approved\n        "
      summary: Merge Chart Transactions
      tags:
      - Core Accounting
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction_ids:
                  type: array
                  items:
                    type: integer
                  description: Array of exactly two transaction IDs to merge
                  example:
                  - 12345
                  - 67890
                transaction_match_id:
                  type: integer
                  description: Optional id of the AutoMergeSuggestion TransactionMatch the user explicitly accepted; marks the merge as a suggestion accept
              required:
              - transaction_ids
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Validation error - invalid transaction count, draft queue not found, same journal, mismatched amounts, or mismatched entities
          description: ''
