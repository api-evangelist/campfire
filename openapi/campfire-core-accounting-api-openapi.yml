          type: string
        description: Comma-separated aggregations, e.g. sum:amount,count:id
      - in: query
        name: all_time
        schema:
          type: boolean
          default: false
        description: If true, uses full transaction date range for the customer; start_date and end_date are ignored
      - in: query
        name: bank
        schema:
