    patch:
      operationId: coa_api_intercompany_journal_entry_partial_update
      description: "\n        Performs a partial update of an intercompany journal entry, allowing modification of specific fields without replacing the entire entry.\n\n        This endpoint supports partial updates to:\n        - Journal entry metadata (memo, date, currency, reference number)\n        - Individual transaction modifications\n        - Entity exchange rate adjustments\n        - Vendor, department, and tag assignments\n        - Account categorizations and amounts\n\n        Key differences from PUT:\n        - Only specified fields are updated (vs. full replacement)\n        - Maintains existing data for unspecified fields\n        - Supports granular transaction modifications\n        - Preserves audit trail and timestamps\n        - Allows incremental changes without full transaction rebuilds\n\n        Validation requirements:\n        - Modified transactions must maintain entity balance (debits = credits)\n        - Cannot modify entries in closed accounting periods\n        - All referenced accounts, vendors, departments must be active\n        - Exchange rates must be valid for multi-currency transactions\n        - Account assignments must be appropriate for transaction types\n        "
      summary: Partial Update Intercompany Journal Entry
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Core Accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedIntercompanyJournalEntry'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedIntercompanyJournalEntry'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedIntercompanyJournalEntry'
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntercompanyJournalEntry'
          description: ''
    delete:
      operationId: coa_api_intercompany_journal_entry_destroy
      description: "\n        Permanently deletes an intercompany journal entry and all related transactions.\n\n        This endpoint performs a comprehensive cleanup when deleting an intercompany journal entry:\n        - Validates that the entry can be deleted (not in closed period)\n        - Removes all associated journal entries across entities\n        - Updates summary tables and account balances\n        - Handles cascade deletion of related transactions\n        - Ensures data integrity across the accounting system\n\n        Deletion restrictions:\n        - Cannot delete entries in closed accounting periods\n\n        Error conditions:\n        - 400 Bad Request: Entry date is in a closed period\n        - 409 Conflict: Entry has protected relationships (e.g., close checklist tasks)\n        - 404 Not Found: Entry does not exist or user lacks access\n\n        On successful deletion, all related journal entries are removed and accounting summaries are recalculated.\n        "
      summary: Delete Intercompany Journal Entry
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Core Accounting
      security:
      - knoxApiToken: []
      responses:
        '204':
          description: No response body
  /coa/api/intercompany-journal-entry/balance:
    post:
      operationId: coa_api_intercompany_journal_entry_balance_create
      description: "\n        Balances an intercompany journal entry by entity and currency.\n\n        This endpoint performs the same balancing logic as the frontend, applying:\n        1. Auto-fetching of exchange rates if not provided (requires date field)\n        2. Exchange rate roll-forward from native to book to consolidation currencies\n        3. Exchange rate plugging to ensure consolidation amounts match across currencies within an entity\n        4. Automatic creation of balancing transactions when debits != credits at any currency level\n\n        The endpoint accepts a partial intercompany journal entry with transactions and optionally exchange rates,\n        and returns the balanced version with:\n        - Auto-fetched exchange rates (if exchange_rates is empty and date is provided)\n        - Updated transactions with calculated book and consolidation amounts\n        - New balancing transactions added where needed\n        - Plugged exchange rates to maintain consolidation consistency\n\n        This is useful for:\n        - Validating journal entries before submission\n        - Understanding what balancing entries will be created\n        - Testing multi-currency and multi-entity scenarios\n        - Auto-fetching exchange rates for the journal date\n        "
      summary: Balance Intercompany Journal Entry
      tags:
      - Core Accounting
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  description: 'Journal entry date (ISO format: YYYY-MM-DD). Used for auto-fetching exchange rates if exchange_rates is empty.'
                transactions:
                  type: array
                  items:
                    type: object
                  description: List of transaction objects
                exchange_rates:
                  type: array
                  items:
                    type: object
                  description: List of exchange rate objects (optional - will be auto-fetched if empty and date is provided)
              required:
              - transactions
            examples:
              BalanceRequest:
                value:
                  transactions:
                  - entity: 54
                    entity_name: Top Level
                    entity_currency: USD
                    currency: EUR
                    debit_amount_native: 1000.0
                    tags: []
                  - entity: 54
                    entity_name: Top Level
                    entity_currency: USD
                    currency: EUR
                    credit_amount_native: 999.5
                    tags: []
                  exchange_rates:
                  - entity: 54
                    entity_name: Top Level
                    originating_currency: EUR
                    target_currency: USD
                    exchange_rate: 1.1
                  - entity: 54
                    entity_name: Top Level
                    originating_currency: USD
                    target_currency: USD
                    exchange_rate: 1.0
                summary: Example balancing request with multi-currency transactions
                description: Request to balance transactions across two entities with different currencies
      security:
      - knoxApiToken: []
      responses:
        '200':
          description: No response body
  /coa/api/journal_entry:
    get:
      operationId: coa_api_journal_entry_list
      description: "\n        Retrieve a paginated list of journal entries with optional filtering and sorting.\n\n        **Query Parameters:**\n        - `start_date`, `end_date`: Filter by date range (defaults to last 6 months)\n        - `account`: Filter by account ID(s) - supports multiple values\n        - `source`: Filter by journal entry source\n        - `journal_id`: Filter by specific journal ID\n        - `all_time`: Include all entries regardless of date (true/false)\n        - `sort`: Sort field (default: \"date\")\n\n        **Response includes:**\n        - Complete journal entry details with all transactions\n        - Account information with names and numbers\n        - Vendor and department details\n        - Tag associations with groups\n        - Attachment information\n        - Exchange rate data for multi-currency entries\n        "
      summary: List Journal Entries
      parameters:
      - in: query
        name: account
        schema:
          type: string
        description: Filter by account ID(s). Can specify multiple values.
        explode: true
        style: form
      - in: query
        name: all_time
        schema:
          type: boolean
          default: false
        description: Include all entries regardless of date range
      - in: query
        name: end_date
        schema:
          type: string
        description: End date for filtering (YYYY-MM-DD format)
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: source
        schema:
          type: string
        description: Filter by journal entry source (e.g., 'manual', 'CSV Upload')
      - in: query
        name: start_date
        schema:
          type: string
        description: Start date for filtering (YYYY-MM-DD format)
      tags:
      - Core Accounting
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
