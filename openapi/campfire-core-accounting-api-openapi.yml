  /coa/api/intercompany-journal-entry:
    get:
      operationId: coa_api_intercompany_journal_entry_list
      description: "\n        Retrieves a paginated list of intercompany journal entries for the authenticated user's customer.\n\n        This endpoint returns:\n        - Summary information for each intercompany journal entry\n        - Basic transaction details (simplified view for list performance)\n        - Entity and exchange rate information\n        - Pagination metadata (count, next, previous)\n        - Reversal relationships and attachment counts\n\n        The response includes:\n        - Intercompany journal entry metadata\n        - Associated transaction summaries\n        - Exchange rate information for currency conversions\n        - Links to related reversals\n        - Attachment information\n\n        Results can be sorted using the 'sort' query parameter with field names like 'date', 'id', etc.\n        Prefix with '-' for descending order (e.g., '-date').\n        "
      summary: List Intercompany Journal Entries
      parameters:
      - in: query
        name: include_deleted
        schema:
          type: boolean
          default: false
        description: 'When set to ''true'', returns ONLY deleted records instead of active records. Deleted records contain minimal data: ''id'', ''is_deleted=true'', ''deleted_at'' timestamp, and ''last_modified_at''. When ''false'' or omitted, returns ONLY active records. This provides clean separation between active and deleted data.'
      - in: query
        name: last_modified_at__gte
        schema:
          type: string
        description: 'Filter for records modified on or after this timestamp. Format: ISO 8601 (e.g., ''2024-01-01T00:00:00Z'' or ''2024-01-01''). Works with both active records and deleted records (filters by deletion time for deleted records).'
      - in: query
        name: last_modified_at__lte
        schema:
          type: string
        description: 'Filter for records modified on or before this timestamp. Format: ISO 8601 (e.g., ''2024-12-31T23:59:59Z'' or ''2024-12-31''). Works with both active records and deleted records (filters by deletion time for deleted records).'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - Core Accounting
      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIntercompanyJournalEntryList'
              examples:
                ListIntercompanyJournalEntriesResponse:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?offset=400&limit=100
                    previous: http://api.example.org/accounts/?offset=200&limit=100
