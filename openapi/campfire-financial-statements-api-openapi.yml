                      account_number: '220012'
                      hierarchy:
                      - OPERATING
                      - ADJUSTMENTS_TO_NET_INCOME
                      - '12235'
                      transaction_activity:
                        '2023-10-01': 4.639999999999972
                        '2023-11-01': -104.85999999999997
