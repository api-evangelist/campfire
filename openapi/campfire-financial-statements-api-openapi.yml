                      type: object
                      properties:
                        account_id:
                          type: integer
                        account_name:
                          type: string
                        account_number:
                          type: string
                        hierarchy:
                          type: array
                          items:
                            type: string
                        transaction_activity:
                          type: object
                          properties:
