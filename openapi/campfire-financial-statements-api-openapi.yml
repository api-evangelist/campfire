      security:
      - knoxApiToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  income_statement:
                    type: array
                    items:
                      type: object
                      properties:
                        account_id:
                          type: integer
                        account_name:
                          type: string
                        account_number:
                          type: string
                        hierarchy:
                          type: array
                          items:
                            type: string
                        YYYY-MM-DD_Group:
                          type: number
                  start_date:
                    type: string
                    format: date
                  end_date:
                    type: string
                    format: date
                  cadence:
                    type: string
                  headers:
                    type: object
              examples:
                Example:
                  value:
                    income_statement:
                    - account_id: '2555'
                      account_name: Sales, General, and Administrative Expenses
                      account_number: '600000'
                      hierarchy:
                      - OPERATING_EXPENSES
                      - '2555'
                      2024-01-01_Total: 14883.910000000002
                    - account_id: '2556'
                      account_name: Sales
                      account_number: '400000'
                      hierarchy:
                      - REVENUE
                      - '2556'
                      2024-01-01_Total: 766651.0
          description: ''
      x-mint:
