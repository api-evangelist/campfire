aid: campfire
name: Campfire
description: >-
  Campfire is an AI-native ERP built for high-growth startups and mid-market
  finance teams outgrowing QuickBooks or Xero, or replacing NetSuite and Sage
  Intacct. It automates core accounting work — general ledger, bank
  reconciliation, accounts payable and receivable, revenue recognition, close
  management, and financial reporting — with an AI assistant (Ember). Campfire
  ships developer-first REST APIs (188 paths / 362 operations across Cash
  Management, Core Accounting, Accounts Payable/Receivable, Revenue Recognition,
  Financial Statements, and Integrations), an official hosted Model Context
  Protocol (MCP) server, and outbound webhooks. Founded 2023; backed by Accel,
  Ribbit Capital, Foundation Capital, Capital49, and Y Combinator.
